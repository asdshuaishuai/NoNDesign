<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- NoNDesign brand icon: 1024x1024, rounded rect rx=225,
       135deg linear gradient #8D9BFF -> #B58CFF -> #FF9BD2,
       white letter N (path M 320 704 L 320 336 L 704 688 L 704 336,
       stroke 84px round cap/join), white dot circle(304,768,r27) @0.9 -->
  <defs>
    <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8D9BFF"/>
      <stop offset="0.5" stop-color="#B58CFF"/>
      <stop offset="1" stop-color="#FF9BD2"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#brand-grad)"/>
  <path d="M 320 704 L 320 336 L 704 688 L 704 336"
        fill="none" stroke="#FFFFFF" stroke-width="84"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="304" cy="768" r="27" fill="#FFFFFF" fill-opacity="0.9"/>
</svg>
