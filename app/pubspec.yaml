name: nondesign
description: "NaN — AI-native product design studio (local-first, on-device design engine)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.1.0+1

environment:
  sdk: ^3.14.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  file_selector: ^1.1.0
  flutter_markdown: ^0.7.7+1
  # chat_stream 直接 import（markdown builder 类型）；此前只作为
  # flutter_markdown 的传递依赖存在，depend_on_referenced_packages 需显式声明。
  markdown: ^7.3.1
  shared_preferences: ^2.5.6
  flutter_svg: ^2.4.0
  # 全平台 WebView：Android WebView / iOS+macOS WKWebView / Windows WebView2 /
  # Linux WebKitGTK 4.1 / OHOS ArkWeb；API 与 webview_flutter 兼容。
  webview_all: ^1.5.2
  # 视频自动播放需要的 WK 专属创建参数由平台包导出；直接 import 必须显式依赖。
  webview_all_wkwebview: ^1.5.2
  # `.nonapp` 单文件包（zip 容器）的读取：只用 ZipDecoder，pure Dart、无平台
  # 通道。**4.x 是 mediapipe_core 的硬约束**（0.2/0.3 都要求 archive ^4.2.0），
  # 3.6.1 与它无解；ZipDecoder.decodeBytes 在 4.x 仍可用（N6 mediapipe 集成的硬前置，
  # 2026-11-17 经协调者批准；nonapp 侧已按 archive 4 API 迁移）。
  archive: ^4.2.0
  # LLM 层（2026-11-23 用户裁决）：只走 Genkit——genkit + genkit_openai 直连
  # 当前服务商，schemantic 提供类型化 schema；思考档位经
  # `OpenAIChatOptions(reasoningEffort:)` 落线。**不要再引入 ai_sdk_dart /
  # ai_sdk_openai，也不要恢复 agent_model_middleware.dart。**
  genkit: ^1.0.3
  genkit_openai: ^1.0.3
  schemantic: ^1.0.0

  # A2UI 渲染底座（S0，见 docs/plan-chat-stream-shell.md §1/§5）：三个包独立
  # 发版——a2ui_flutter 渲染 surface（钉 0.3.x 防 API 漂移），a2ui_agent 出
  # 系统提示与流解析（与 flutter 同轨 0.3.x），a2ui_core 是两者共用的协议核心
  # （自己的版本线，flutter/agent 0.3.0 都要求 ^0.7.0）。封装在
  # lib/widgets/a2ui_card.dart，升级只改封装。
  a2ui_flutter: ^0.3.0
  a2ui_agent: ^0.3.0
  a2ui_core: ^0.7.0
  # MediaPipe for Flutter（N6，2026-11-17 用户裁决）：只引入基础 task 能力。
  # **不引入 mediapipe_audio / mediapipe_decision**，也**不引入 LiteRT-LM /
  # Gemma 端侧 LLM**（明确不做）。版本按 `flutter pub add` 实际解析（0.3.0，
  # 2026-11-12 时点为 0.2.1）；0.x API 会动，原生导入只允许出现在
  # lib/core/mediapipe_embedder_adapter.dart，其余代码只认 MediaPipeEmbedder
  # 接口（core/mediapipe_embedder.dart）。
  mediapipe_core: ^0.3.0
  mediapipe_retrieval: ^0.3.0
  mediapipe_vision: ^0.3.0
  mediapipe_text: ^0.3.0
  # ---- 本地能力层依赖（批次 01 起） ----------------------------------------
  # cryptography：DDP1/DDP2 的纯 Dart 实现（批次 05 起替换 Python ddp.py）。
  cryptography: ^2.9.0
  # sqlite3 3.x 自己带 build hook 编译 SQLite 原生库；sqlite3_flutter_libs
  # 0.6.0+eol 是官方退役标记包（pubspec 自述 "Not used anymore"），迁移计划
  # 仍要求显式锁定它，故保留为 direct dependency（不提供任何代码）。
  sqlite3: ^3.9.1
  sqlite3_flutter_libs: ^0.6.0+eol
  # 进程内 wasm 宿主（引擎）。wasm_run_flutter 只是 Flutter 侧注册，
  # 真正的执行器来自 wasm_run；后者 vendored 到 third_party/wasm_run
  # （hooks 2.x 兼容 + 离线动态库，见 docs/wasm-run-vendoring.md）。
  wasm_run_flutter: ^0.2.0+1
  # 应用数据目录（缓存/数据库/日志），从传递依赖提升为直接依赖：
  # 批次 07/08 的离线缓存与本地库都要自己决定落盘位置。
  path_provider: ^2.1.6

# sqlite3 3.x 的构建 hook 默认从 GitHub 下载预编译库（离线构建会失败）。
# 改为使用系统自带的 SQLite（macOS/iOS/Linux/Android 都有），构建全程离线。
# ⚠️ Windows 不自带 sqlite3.dll：批次 07 接通 app.db 前必须补 vendored 源码
# 或随包二进制，否则 Windows 上「应用数据」能力不可用（已登记，不静默降级）。
hooks:
  user_defines:
    sqlite3:
      source: system

# wasm_run 必须以 path 覆盖：pub.dev 的 0.2.0+2 依赖 build_rust_binaries
# （hooks ^1.0.0），与 mediapipe_core 0.3.0 的 hooks >=2.0.0 无法共存。
# 覆盖版本与 pub.dev 同号（0.2.0+2），只替换构建 hook。升级 wasm_run 时
# 同步刷新 third_party/wasm_run 与 scripts/fetch_wasm_run_libs.sh 的 sha256 表。
dependency_overrides:
  wasm_run:
    path: ../third_party/wasm_run
  # wasm_run_flutter 的 iOS/macOS 原生桩会硬引用静态库符号（EnforceBundling.swift），
  # 与 vendored 动态库方案冲突 → 同样 vendored（仅中和该桩，Dart 面不变）。
  wasm_run_flutter:
    path: ../third_party/wasm_run/wasm_run_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 真机/模拟器 UI 冒烟（移动端路由与工作台返回路径）
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # webview 测试替身直接 import 的平台接口（nonapp_hotapp_mount_test /
  # nonapp_offline_test / three_workspace_test / shelf_video_player_test）；
  # webview_all 的平台接口与 webview_flutter 同形（测试专用 → dev_dependencies）。
  webview_platform_interface: ^1.5.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # 离线模型注册表：models.dev 快照（scripts/sync_models.py 是唯一写入方）。
  # 移动端离线（PLAN 直连/连接桌面失败）时模型选择与
  # toolCall/protocol 门控的数据源；store.ensureBundledRegistry 消费。
  assets:
    - assets/models.json
    # 引擎资产（批次 01 起由 scripts/sync_engine.py 同步）：
    # moonviz.wasm + components.json + manifest.json 三者同源同版本；
    # 漂移由 test/engine_asset_drift_test.dart 守门。
    - assets/engine/
    # 3D 预览模板与 three.module.js（发布包必须随包，否则 3D 工作台报
    # “assets/three/preview.html: Unable to load asset”）。
    - assets/three/
    # vendored three-live 1.4.0（预览页沙箱执行面；LICENSE / NOTICE 同目录）。
    # Flutter 目录资产不递归子目录，所以显式列出。
    - assets/three/vendor/
    # vendored ThreeUI Community 组件页面（画廊；catalog.json + LICENSE/NOTICE）。
    - assets/three/threeui/
    # A2UI 官方 Web 渲染器的自包含页面（release 依赖 asset 声明，debug 回退
    # 仓库路径只用于测试）。
    - assets/a2ui_web/
    # 动效合成短片（自包含 HTML + clips.json，运行时离线加载）
    - assets/video/clip/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
