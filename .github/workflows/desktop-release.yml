name: desktop-release

# 构建 NaN 桌面「安装包」并发布到本仓库的 GitHub Release。
#
# 触发：push 到发布分支 release/2026-11-18-nan，或手动 workflow_dispatch。
#
# 产物（只有安装包，不再发布便携版 zip）：
#   NaN-<VERSION>-macos-arm64.dmg        macOS 安装包（拖入 Applications）
#   NaN-<VERSION>-windows-x64-setup.exe  Windows 安装包（Inno Setup）
#   SHA256SUMS.txt                       两个安装包的校验和
#
# 版本号唯一来源：仓库根 VERSION（与 app/pubspec.yaml 同步）。

on:
  push:
    branches:
      - release/2026-11-18-nan
  workflow_dispatch:

# 同一分支的发布串行执行，避免两个 run 同时写同一个 Release。
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  # 门禁：先跑分析 + 全部测试，不打包。两个安装包 job 都 needs 它。
  #
  # 为什么 gate 放在 macOS（而不是 ubuntu）：
  #   - 这套测试只在 macOS 上完整验证过：壳层平台分支、应用内 WebView、
  #     本地引擎动态库、系统 SQLite 都依赖 macOS 实测过的行为；
  #   - gate 红掉就完全出不了安装包，所以优先用已验证环境，避免把发布
  #     卡在 Linux 平台的未知差异上；
  #   - macOS 构建机是 arm64，与本地发布验证环境一致。
  # 想换回 Linux 前，必须先在 Linux 上把 analyze + 全量 test 跑绿并留下证据；
  # 任何一个用例只在某个平台失败时，要改成显式用例清单并在这里写明原因，
  # 不能静默跳过整套测试。
  gate:
    name: gate (analyze + test)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # --no-fatal-infos：仓库现有 131 条 info 级既有告警（Flutter 3.50 把
      # material.dart 标记为 deprecated、指向 material_ui 迁移），全在测试与既有
      # 代码里，属批次级迁移而不是本次功能引入。error / warning 仍然会让门禁
      # 失败；info 不拦发布。迁移完成后删掉这个开关即可恢复零容忍。
      - name: flutter analyze
        working-directory: app
        run: flutter analyze --no-pub --no-fatal-infos

      # 一次串行重试：个别用例对调度时序敏感（对端断连、检索防抖、SSE
      # 流式），在本机稳定通过、在 CI 共享 runner 上偶发失败。第一次失败时
      # 用 --concurrency=2 重跑一次；两次都失败才判门禁红（不静默跳过任何用例）。
      - name: flutter test
        working-directory: app
        run: |
          set -euo pipefail
          if flutter test --no-pub; then
            exit 0
          fi
          echo "::warning::第一次 flutter test 失败（多为时序敏感用例），降低并发重跑一次"
          flutter test --no-pub --concurrency=2

  # macOS 安装包：.app → ad-hoc 签名 → DMG（含 Applications 拖拽链接、卷标、卷图标）。
  # 只在 Apple Silicon 构建机上产出（应用本身 ARCHS=arm64，MediaPipe 也没有 Intel 切片）。
  # 为什么用 macos-26 而不是 macos-15：2026-11-19 实测 macos-15 标签在公开仓库上
  # 长时间排队（20 分钟仍未分配 runner），而 macos-26 立即分配且是 arm64
  # （Image: macos-26-arm64）。下面的 uname 守卫继续兜住架构。
  macos-release:
    name: macos-release (arm64 dmg)
    needs: gate
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 读取版本
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: 确认 Apple Silicon 构建机
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "构建机架构: $arch"
          if [ "$arch" != "arm64" ]; then
            echo "::error::macOS 安装包需要 Apple Silicon 构建机（当前 $arch）。请把 runs-on 换成 arm64 标签。"
            exit 1
          fi

      - name: 启用 macOS 桌面
        run: flutter config --enable-macos-desktop

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: 构建 macOS Release
        working-directory: app
        run: flutter build macos --release --no-pub

      - name: 打包 DMG 安装包
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/installer/make_dmg.sh \
            --app "app/build/macos/Build/Products/Release/NaN.app" \
            --version "${{ steps.version.outputs.version }}" \
            --out dist

      - name: 产物清单
        run: ls -lh dist

      - name: 上传 macOS 安装包
        uses: actions/upload-artifact@v4
        with:
          name: NaN-macos-dmg
          path: dist/NaN-${{ steps.version.outputs.version }}-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 14

  # Windows 安装包：Flutter Release 目录 → Inno Setup → setup.exe。
  # Windows 本地引擎冒烟：在真实 Windows runner 上加载 wasm_run DLL 并跑
  # 引擎契约（用户实测 v0.1.0 exe 构建原型报「需要设计服务」——本地引擎
  # 在 Windows 上没起来，但桌面/移动测试都没覆盖 Windows DLL 加载路径；
  # 这个 job 就是那条路的地面真相）。libs 已入库（third_party/wasm_run/
  # libs），hook 离线取本地副本，不依赖网络。
  windows-engine-smoke:
    name: windows-engine-smoke (DLL load + wasm contract)
    needs: windows-engine-dll
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 真因 2026-11-19：上游预编译的 Windows 资产是 wasmi 后端（无 SIMD），
      # 编译不了带 SIMD 的引擎 wasm（SIMD support is not enabled）。smoke
      # 用 windows-engine-dll 自建的 wasmtime DLL 覆盖 vendored 裸名文件。
      - uses: actions/download-artifact@v4
        with:
          name: wasm_run_dart-windows-x64
          path: artifact

      - name: 覆盖 vendored 执行器（wasmi → wasmtime）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = "artifact\wasm_run_dart-x86_64-pc-windows-msvc.dll"
          $dst = "third_party\wasm_run\libs\wasm_run_dart-dynamic-x86_64-pc-windows-msvc"
          if (-not (Test-Path $src)) { throw "artifact 里没有 $src" }
          Copy-Item $src $dst -Force
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          Write-Host "vendored executor sha256: $hash"

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # 判定走输出文件而非退出码（2026-11-19 两轮实证）：wasmtime 在 Windows
      # 上的 trap 展开（fuel/timeout 的 catch_unwind 跨 FFI 边界）会在测试
      # 结束后的退出阶段 panic abort，退出码不可信；且 --machine 事件不带
      # 错误文本、GitHub 日志视图还会截掉中段。人类可读输出落盘，按 ✅/[E]
      # 计数判定，失败行连同断言详情全部留在日志里。
      - name: 引擎宿主 + 契约冒烟（真实 DLL 加载）
        working-directory: app
        shell: pwsh
        run: |
          flutter test --no-pub test/engine_host_test.dart test/engine_contract_test.dart *> engine-smoke-full.log
          $passed = (Select-String -Path engine-smoke-full.log -Pattern '✅').Count
          $failedLines = Select-String -Path engine-smoke-full.log -Pattern '\[E\]'
          $failedLines | ForEach-Object { Write-Host $_.Line }
          if ($failedLines.Count -gt 0) {
            Write-Host "::error::engine smoke: $($failedLines.Count) failed, $passed passed"
            exit 1
          }
          if ($passed -lt 30) {
            Write-Host "::error::engine smoke: too few passing tests ($passed) — the run likely aborted before tests executed"
            Get-Content engine-smoke-full.log -Tail 40 | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "engine smoke: $passed passed (teardown abort tolerated)"
          # pwsh 会把最后一个原生命令（flutter test 因 teardown abort 的 1）
          # 当作进程退出码传播——判定已通过，显式归零。
          exit 0

  # Windows 引擎执行器自建（真因 2026-11-19，CI smoke 实证）：上游 wasm_run
  # v0.2.0 的 Windows 预编译资产是 wasmi 后端——wasmi 没有 SIMD，引擎 wasm
  # 一编译就「SIMD support is not enabled」，这就是 Windows 上设计引擎起不
  # 来的源头（macOS/Linux 资产是 wasmtime，不受影响）。这里从上游源码按
  # pinned tag 自建默认 features 的 DLL（wasmtime 后端、含 SIMD），供 smoke
  # 验证与 Windows 安装包覆盖；产物附为 artifact，验证通过后把字节与
  # sha256 固定回 vendored 库 + fetch 脚本（维护者动作）。
  windows-engine-dll:
    name: windows-engine-dll (build wasmtime executor)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # 主分支而非 v0.2.0 tag（2026-11-19 本地实证）：app 解析的 flutter_rust_bridge
      # 是 Dart 2.12（v2），vendored 执行器（可用的 mac 版）带 v2 多包绑定
      # 前缀（frb_get_rust_content_hash 等）——只有 main 的 FRB v2 预生成
      # frb_generated.rs 提供它们；tag 上的 FRB v1 build.rs 会重新生成旧符号
      # 面（无前缀）且其 dart format 调用在新 dart 上崩。main 无 build.rs，
      # 纯 cargo build。sha pinned。
      - name: 检出上游 wasm_run（pinned main commit）
        uses: actions/checkout@v4
        with:
          repository: juancastillo0/wasm_run
          ref: 23e36bdf111b3eca55bece5c6dd5a1364d26a0a3

      - name: 选择 wasmtime 后端（含 SIMD；上游 config_api.sh）
        shell: bash
        run: bash scripts/config_api.sh wasmtime

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm_run-dll-${{ runner.os }}-wasmtime-main-23e36bdf

      - name: 构建 wasmtime 后端 DLL（默认 features 含 simd）
        run: cargo build --release -p wasm_run_dart

      - name: 归档产物 + sha256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dll = "target\release\wasm_run_dart.dll"
          if (-not (Test-Path $dll)) { throw "DLL 未产出：$dll" }
          Copy-Item $dll wasm_run_dart-x86_64-pc-windows-msvc.dll -Force
          $hash = (Get-FileHash "wasm_run_dart-x86_64-pc-windows-msvc.dll" -Algorithm SHA256).Hash.ToLower()
          "$hash  wasm_run_dart-x86_64-pc-windows-msvc.dll" | Out-File -Encoding ascii wasm_run_dart.dll.sha256
          Write-Host "sha256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm_run_dart-windows-x64
          path: |
            wasm_run_dart-x86_64-pc-windows-msvc.dll
            wasm_run_dart.dll.sha256
          if-no-files-found: error

  windows-release:
    name: windows-release (x64 setup.exe)
    needs: [gate, windows-engine-dll]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 安装包必须带 wasmtime 执行器（上游 Windows 资产是 wasmi，引擎起不
      # 来，见 windows-engine-dll 注释）——native-asset hook 从 vendored
      # 裸名文件拷 wasm_run_dart.dll 进包，覆盖这一份即可换掉整条链。
      - uses: actions/download-artifact@v4
        with:
          name: wasm_run_dart-windows-x64
          path: artifact

      - name: 覆盖 vendored 执行器（wasmi → wasmtime）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = "artifact\wasm_run_dart-x86_64-pc-windows-msvc.dll"
          $dst = "third_party\wasm_run\libs\wasm_run_dart-dynamic-x86_64-pc-windows-msvc"
          if (-not (Test-Path $src)) { throw "artifact 里没有 $src" }
          Copy-Item $src $dst -Force
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          Write-Host "vendored executor sha256: $hash"

      - name: 读取版本
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: 启用 Windows 桌面
        run: flutter config --enable-windows-desktop

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: 构建 Windows Release
        working-directory: app
        run: flutter build windows --release --no-pub

      - name: 定位 Windows 产物
        id: winout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "app\build\windows\x64\runner\Release",
            "app\build\windows\runner\Release"
          )
          $out = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $out) {
            Write-Host "::error::找不到 Windows 构建产物。实际目录树："
            foreach ($root in @("app\build\windows", "app\build")) {
              if (Test-Path -LiteralPath $root) {
                Write-Host "--- $root ---"
                Get-ChildItem -LiteralPath $root -Recurse -Depth 3 |
                  Select-Object -ExpandProperty FullName
              }
            }
            exit 1
          }
          $exe = Join-Path $out "NaN.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Host "::error::$out 里没有 NaN.exe。目录内容："
            Get-ChildItem -LiteralPath $out -Recurse -Depth 2 |
              Select-Object -ExpandProperty FullName
            exit 1
          }
          $resolved = (Resolve-Path -LiteralPath $out).Path
          Write-Host "Release 目录: $resolved"
          "release_dir=$resolved" >> $env:GITHUB_OUTPUT

      - name: 校验引擎动态库随包（缺失 = 本地引擎起不来）
        shell: pwsh
        run: |
          $dll = Join-Path "${{ steps.winout.outputs.release_dir }}" "wasm_run_dart.dll"
          if (-not (Test-Path -LiteralPath $dll)) {
            Write-Host "::error::Release 目录缺 wasm_run_dart.dll —— 本地引擎在 Windows 上无法启动"
            Get-ChildItem -LiteralPath "${{ steps.winout.outputs.release_dir }}" |
              Select-Object -ExpandProperty Name
            exit 1
          }
          Write-Host "engine dll ok: $dll ($((Get-Item $dll).Length) bytes)"

      - name: 安装 Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: 编译 Windows 安装包
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DIR: ${{ steps.winout.outputs.release_dir }}
        run: |
          $ErrorActionPreference = "Stop"
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $iscc) {
            Write-Host "::error::找不到 ISCC.exe（Inno Setup 编译器）。已安装的 ISCC："
            Get-ChildItem -Path "${env:ProgramFiles(x86)}", "$env:ProgramFiles" `
              -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            exit 1
          }
          Write-Host "ISCC: $iscc"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $icon = Join-Path $env:GITHUB_WORKSPACE "app\windows\runner\resources\app_icon.ico"
          $defines = @(
            "/DMyVersion=$env:VERSION",
            "/DAppSourceDir=$env:RELEASE_DIR",
            "/DOutputDir=$dist",
            "/DAppIcon=$icon"
          )
          # 简体中文是 Inno Setup 6.5.0 起的官方语言文件；有就启用中文向导，
          # 老版本则保持英文向导（不联网下载第三方翻译）。
          $languageFile = Join-Path (Split-Path -Parent $iscc) "Languages\ChineseSimplified.isl"
          if (Test-Path -LiteralPath $languageFile) {
            Write-Host "使用简体中文安装向导: $languageFile"
            $defines += "/DWithChineseSimplified=1"
          } else {
            Write-Host "::warning::没有找到 Languages\ChineseSimplified.isl（需要 Inno Setup 6.5+），安装向导保持英文"
          }
          & $iscc @defines "scripts\installer\nan.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Inno Setup 编译失败（exit $LASTEXITCODE）"
            exit 1
          }
          $setup = Join-Path $dist "NaN-$env:VERSION-windows-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) {
            Write-Host "::error::没有生成 $setup。dist 内容："
            Get-ChildItem -LiteralPath $dist | Select-Object -ExpandProperty FullName
            exit 1
          }
          Get-Item -LiteralPath $setup | Format-List FullName, Length

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: NaN-windows-setup
          path: dist/NaN-${{ steps.version.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  # 发布：下载两个安装包 → SHA256SUMS.txt → 创建/更新 tag v<VERSION> 的 Release。
  # 可重复运行：overwrite_files 会覆盖同名资产（等价 --clobber）。
  release:
    name: release (GitHub Release)
    needs: [gate, macos-release, windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: 下载两个安装包
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成 SHA256SUMS.txt
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: dist
        run: |
          set -euo pipefail
          ls -lh
          dmg="NaN-${VERSION}-macos-arm64.dmg"
          exe="NaN-${VERSION}-windows-x64-setup.exe"
          for f in "$dmg" "$exe"; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少安装包 $f"
              exit 1
            fi
          done
          sha256sum "$dmg" "$exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 渲染 Release 正文
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sed "s/__VERSION__/${VERSION}/g" docs/release-notes.md > dist/RELEASE_NOTES.md

      - name: 创建/更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NaN ${{ steps.version.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/NaN-${{ steps.version.outputs.version }}-macos-arm64.dmg
            dist/NaN-${{ steps.version.outputs.version }}-windows-x64-setup.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
