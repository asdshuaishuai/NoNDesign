name: windows-release

on:
  workflow_dispatch:
  push:
    branches:
      - release/2026-11-18-nan

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release --no-pub

      - name: Package release folder
        working-directory: app
        shell: pwsh
        run: |
          $candidates = @(
            "build\windows\x64\runner\Release",
            "build\windows\runner\Release"
          )
          $out = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $out) {
            Write-Error "Windows release output not found"
            exit 1
          }
          Write-Host "Packaging $out"
          Compress-Archive -Path "$out\*" -DestinationPath "..\NaN-windows-x64.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: NaN-windows-x64
          path: NaN-windows-x64.zip
          if-no-files-found: error
